name: visual-audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Vercel production
        run: |
          for i in {1..18}; do
            if curl -fsS --max-time 15 https://movidashop.vercel.app/ | grep -qi "MO Vida"; then
              echo "Production responds; allowing the production alias to settle"
              sleep 35
              exit 0
            fi
            echo "Waiting for deployment... ($i/18)"
            sleep 10
          done
          echo "Production URL did not become ready in time"
          exit 1

      - name: Capture desktop and mobile audit
        run: |
          mkdir -p audit
          cat > audit-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const results = {};
          const targets = [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true },
          ];

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: target.viewport,
              isMobile: target.isMobile || false,
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            const consoleErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', error => consoleErrors.push(`pageerror: ${error.message}`));
            page.on('requestfailed', req => failedRequests.push({ url: req.url(), error: req.failure()?.errorText }));

            const response = await page.goto('https://movidashop.vercel.app/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(1500);

            const metrics = await page.evaluate(() => {
              const images = Array.from(document.images).map(img => ({
                src: img.currentSrc || img.src,
                alt: img.alt,
                naturalWidth: img.naturalWidth,
                naturalHeight: img.naturalHeight,
                complete: img.complete,
              }));
              const bodyText = document.body.innerText || '';
              return {
                title: document.title,
                h1: document.querySelector('h1')?.textContent?.trim() || '',
                bodyPreview: bodyText.slice(0, 500),
                bodyWidth: document.body.scrollWidth,
                viewportWidth: window.innerWidth,
                overflowX: document.body.scrollWidth > window.innerWidth,
                links: Array.from(document.querySelectorAll('a')).map(a => ({ text: (a.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80), href: a.href })).filter(x => x.href),
                buttons: Array.from(document.querySelectorAll('button')).map(b => ({ text: (b.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80), aria: b.getAttribute('aria-label') })),
                images,
                brokenImages: images.filter(img => img.complete && (!img.naturalWidth || !img.naturalHeight)),
              };
            });

            await page.screenshot({ path: `audit/${target.name}-full.png`, fullPage: true });
            await page.screenshot({ path: `audit/${target.name}-fold.png`, fullPage: false });

            const storySection = page.locator('#historias');
            if (await storySection.count()) {
              await storySection.scrollIntoViewIfNeeded();
              const nextStory = page.getByRole('button', { name: 'Ver siguiente historia' });
              if (await nextStory.count()) {
                await nextStory.click();
                await page.waitForTimeout(800);
                const storyImage = storySection.locator('img').first();
                results[`${target.name}SecondStory`] = await storyImage.evaluate(img => ({
                  src: img.currentSrc || img.src,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  complete: img.complete,
                }));
                await storySection.screenshot({ path: `audit/${target.name}-story-2.png` });
              }
            }

            if (target.name === 'desktop') {
              const menuAnchor = page.locator('a[href="#menu"]').first();
              if (await menuAnchor.count()) {
                await menuAnchor.click();
                await page.waitForTimeout(500);
                await page.screenshot({ path: 'audit/desktop-menu.png', fullPage: false });
              }
            }

            results[target.name] = {
              status: response?.status(),
              url: page.url(),
              ...metrics,
              consoleErrors,
              failedRequests,
            };
            await context.close();
          }

          fs.writeFileSync('audit/report.json', JSON.stringify(results, null, 2));

          const failures = [];
          for (const target of ['desktop', 'mobile']) {
            const result = results[target];
            if (!result) {
              failures.push(`${target}: no result captured`);
              continue;
            }
            if (result.status !== 200) failures.push(`${target}: HTTP ${result.status}`);
            if (!result.h1) failures.push(`${target}: missing H1/app content`);
            if (!result.links?.length) failures.push(`${target}: no links rendered`);
            if ((result.bodyPreview || '').includes('Application error')) failures.push(`${target}: Next.js application error rendered`);
            if (result.overflowX) failures.push(`${target}: horizontal overflow`);
            if (result.brokenImages?.length) failures.push(`${target}: ${result.brokenImages.length} broken image(s)`);
            if (result.consoleErrors?.length) failures.push(`${target}: ${result.consoleErrors.length} console/page error(s)`);
            if (result.failedRequests?.length) failures.push(`${target}: ${result.failedRequests.length} failed request(s)`);
          }

          await browser.close();
          if (failures.length) throw new Error(`Visual audit failed: ${failures.join('; ')}`);
          EOF
          node audit-run.mjs

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movida-visual-audit
          path: audit/
          if-no-files-found: error
          retention-days: 7
